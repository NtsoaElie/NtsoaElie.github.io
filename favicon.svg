<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#241040"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%"  stop-color="#1a0a30"/>
      <stop offset="100%" stop-color="#06040f"/>
    </radialGradient>
  </defs>

  <!-- dark tile + faint electric-blue rim -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5"
        fill="none" stroke="#46c8ff" stroke-opacity="0.35" stroke-width="1"/>

  <!-- pixel shadow-monarch cowl + cloak (2x2 units, centered) -->
  <g fill="url(#cloak)">
    <rect x="14" y="6"  width="4"  height="2"/>
    <rect x="12" y="8"  width="8"  height="2"/>
    <rect x="10" y="10" width="12" height="2"/>
    <rect x="8"  y="12" width="16" height="2"/>
    <!-- eye row: outer wall + bridge, gaps left for glowing eyes -->
    <rect x="6"  y="14" width="4"  height="2"/>
    <rect x="12" y="14" width="8"  height="2"/>
    <rect x="22" y="14" width="4"  height="2"/>
    <rect x="6"  y="16" width="20" height="2"/>
    <rect x="4"  y="18" width="24" height="2"/>
    <rect x="4"  y="20" width="24" height="2"/>
    <rect x="6"  y="22" width="20" height="2"/>
    <rect x="8"  y="24" width="16" height="2"/>
    <rect x="10" y="26" width="12" height="2"/>
  </g>

  <!-- glowing violet eyes (dim halo + bright core, no blur to stay crisp) -->
  <g fill="#9b5cff" opacity="0.35">
    <rect x="9"  y="13" width="4" height="4"/>
    <rect x="19" y="13" width="4" height="4"/>
  </g>
  <g fill="#c9a8ff">
    <rect x="10" y="14" width="2" height="2"/>
    <rect x="20" y="14" width="2" height="2"/>
  </g>
</svg>
